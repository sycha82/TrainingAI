<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물류센터 설비 매칭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-rule {
            background: #667eea;
            color: white;
        }

        .btn-rule:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-ml {
            background: #764ba2;
            color: white;
        }

        .btn-ml:hover {
            background: #6a4190;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .result h3 {
            margin-bottom: 15px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-item {
            padding: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 5px;
        }

        .result-item strong {
            display: block;
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            display: flex;
            justify-content: space-around;
        }

        .status-item {
            text-align: center;
        }

        .status-item .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .status-item .value {
            font-size: 18px;
            font-weight: 600;
        }

        .status-item.active .value {
            color: #28a745;
        }

        .status-item.inactive .value {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 물류센터 설비 매칭</h1>
            <p>AI가 최적의 설비를 찾아드립니다</p>
        </div>

        <div class="content">
            <!-- 상태 표시 -->
            <div class="status" id="status">
                <div class="status-item">
                    <div class="label">규칙 기반</div>
                    <div class="value">-</div>
                </div>
                <div class="status-item">
                    <div class="label">머신러닝</div>
                    <div class="value">-</div>
                </div>
                <div class="status-item">
                    <div class="label">사용 가능 설비</div>
                    <div class="value">-</div>
                </div>
            </div>

            <!-- 주문 입력 폼 -->
            <form id="orderForm">
                <div class="form-group">
                    <label for="orderId">주문 ID</label>
                    <input type="text" id="orderId" value="ORD-001" required>
                </div>

                <div class="form-group">
                    <label for="weight">무게 (kg)</label>
                    <input type="number" id="weight" value="10" min="0.1" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="volume">부피 (m³)</label>
                    <input type="number" id="volume" value="0.5" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="itemCount">품목 수</label>
                    <input type="number" id="itemCount" value="5" min="1" required>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="fragile">
                        <label for="fragile">깨지기 쉬운 물품</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="priority">우선순위</label>
                    <select id="priority">
                        <option value="1">1 - 낮음</option>
                        <option value="2" selected>2 - 보통</option>
                        <option value="3">3 - 높음</option>
                        <option value="4">4 - 긴급</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destinationZone">목적지 구역</label>
                    <select id="destinationZone">
                        <option value="A" selected>A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="orderType">주문 유형</label>
                    <select id="orderType">
                        <option value="standard" selected>Standard</option>
                        <option value="express">Express</option>
                        <option value="bulk">Bulk</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-rule" onclick="matchRuleBased()">
                        📐 규칙 기반 매칭
                    </button>
                    <button type="button" class="btn-ml" id="mlButton" onclick="matchML()">
                        🤖 머신러닝 매칭
                    </button>
                </div>
            </form>

            <!-- 로딩 표시 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>처리 중...</p>
            </div>

            <!-- 결과 표시 -->
            <div class="result" id="result">
                <h3 id="resultTitle"></h3>
                <div class="result-grid" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // 페이지 로드 시 상태 확인
        window.addEventListener('load', checkHealth);

        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                updateStatus(data);
            } catch (error) {
                console.error('서버 연결 실패:', error);
                alert('API 서버에 연결할 수 없습니다. 서버가 실행 중인지 확인하세요.');
            }
        }

        function updateStatus(data) {
            const statusEl = document.getElementById('status');
            const items = statusEl.querySelectorAll('.status-item');

            items[0].className = 'status-item active';
            items[0].querySelector('.value').textContent = '✅ 사용 가능';

            items[1].className = data.ml_engine === 'trained' ? 'status-item active' : 'status-item inactive';
            items[1].querySelector('.value').textContent = data.ml_engine === 'trained' ? '✅ 학습됨' : '❌ 미학습';

            items[2].className = 'status-item';
            items[2].querySelector('.value').textContent = data.available_facilities;

            // ML 버튼 활성화/비활성화
            document.getElementById('mlButton').disabled = data.ml_engine !== 'trained';
        }

        function getOrderData() {
            return {
                order_id: document.getElementById('orderId').value,
                weight: parseFloat(document.getElementById('weight').value),
                volume: parseFloat(document.getElementById('volume').value),
                item_count: parseInt(document.getElementById('itemCount').value),
                fragile: document.getElementById('fragile').checked,
                priority: parseInt(document.getElementById('priority').value),
                destination_zone: document.getElementById('destinationZone').value,
                order_type: document.getElementById('orderType').value
            };
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showResult(data, engineType) {
            const resultEl = document.getElementById('result');
            const titleEl = document.getElementById('resultTitle');
            const contentEl = document.getElementById('resultContent');

            if (data.success) {
                resultEl.className = 'result success';
                titleEl.textContent = `✅ 최적 설비를 찾았습니다! (${engineType})`;

                const scoreLabel = data.engine_type === 'rule-based' ? '매칭 점수' : '확신도';
                const scoreValue = data.engine_type === 'rule-based' ?
                    (data.score * 100).toFixed(2) + '%' :
                    (data.confidence * 100).toFixed(2) + '%';

                contentEl.innerHTML = `
                    <div class="result-item">
                        <strong>설비 이름</strong>
                        ${data.facility.name}
                    </div>
                    <div class="result-item">
                        <strong>설비 유형</strong>
                        ${data.facility.facility_type}
                    </div>
                    <div class="result-item">
                        <strong>${scoreLabel}</strong>
                        ${scoreValue}
                    </div>
                    <div class="result-item">
                        <strong>속도 등급</strong>
                        ${data.facility.speed_rating}/4
                    </div>
                    <div class="result-item">
                        <strong>최대 용량</strong>
                        ${data.facility.max_weight}kg, ${data.facility.max_volume}m³
                    </div>
                    <div class="result-item">
                        <strong>깨지기 쉬운 물품</strong>
                        ${data.facility.can_handle_fragile ? '✅ 가능' : '❌ 불가능'}
                    </div>
                `;
            } else {
                resultEl.className = 'result error';
                titleEl.textContent = '❌ 매칭 실패';
                contentEl.innerHTML = `<p>${data.message}</p>`;
            }

            resultEl.style.display = 'block';
        }

        async function matchRuleBased() {
            showLoading();

            try {
                const orderData = getOrderData();
                const response = await fetch(`${API_URL}/match/rule-based`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                const data = await response.json();
                hideLoading();
                showResult(data, '규칙 기반');

            } catch (error) {
                hideLoading();
                alert('오류 발생: ' + error.message);
            }
        }

        async function matchML() {
            showLoading();

            try {
                const orderData = getOrderData();
                const response = await fetch(`${API_URL}/match/ml`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.status === 503) {
                    hideLoading();
                    alert('ML 모델이 학습되지 않았습니다. 서버에서 /train/ml을 먼저 호출하세요.');
                    return;
                }

                const data = await response.json();
                hideLoading();
                showResult(data, '머신러닝');

            } catch (error) {
                hideLoading();
                alert('오류 발생: ' + error.message);
            }
        }
    </script>
</body>
</html>
